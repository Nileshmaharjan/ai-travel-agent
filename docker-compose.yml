services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel  # local development only
      POSTGRES_DB: travel_agents
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # 5433 avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_agents"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
