name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
          POSTGRES_DB: travel_agents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel -d travel_agents"
          --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests (offline, plus the Postgres checkpoint test)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://travel:travel@localhost:5432/travel_agents
