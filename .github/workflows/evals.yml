name: Evals

# Live run against the real model and APIs. Needs repository secrets:
# GROQ_API_KEY, TAVILY_API_KEY, AVIATIONSTACK_API_KEY (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Run only the first N cases (0 = all 30)"
        default: "10"
  schedule:
    - cron: "0 0 * * 1"  # Mondays 00:00 UTC (09:00 KST)

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
        run: travel-agents-eval --limit "${{ github.event.inputs.limit || '0' }}" --out evals/results
      - name: Publish summary
        if: always()
        run: cat evals/results/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
